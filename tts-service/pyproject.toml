[project]
name = "tts-service"
version = "0.1.0"
description = "FastAPI service wrapping VieNeu-TTS (v3 Turbo, CPU int8)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "vieneu>=3.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
